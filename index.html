// ============================================================

const session = {
  token: null,
  refresh: null,
  load() {
    try {
      const r = sessionStorage.getItem(CFG.sessionStore);
      if (r) {
        const s = JSON.parse(r);
        this.token = s.access_token;
        this.refresh = s.refresh_token;
      }
    } catch {}
    return this.token;
  },
  save(a, r) {
    this.token = a;
    this.refresh = r;
    try {
      sessionStorage.setItem(CFG.sessionStore, JSON.stringify({
        access_token: a,
        refresh_token: r
      }));
    } catch {}
  },
  clear() {
    this.token = null;
    this.refresh = null;
    try {
      sessionStorage.removeItem(CFG.sessionStore);
    } catch {}
  }
};
const auth = {
  async login(password) {
    const res = await fetch(`${CFG.url}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: {
        apikey: CFG.key,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email: CFG.adminEmail,
        password
      })
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error_description || d.msg || "Incorrect password");
    session.save(d.access_token, d.refresh_token);
    return true;
  },
  async changePassword(pw) {
    const res = await fetch(`${CFG.url}/auth/v1/user`, {
      method: "PUT",
      headers: {
        apikey: CFG.key,

  },
  logout() {
    session.clear();
  }
};

// ============================================================
// Data layer — REST + RPC with a paginating helper
// ============================================================
const rest = async (path, {
  method = "GET",
  body,
  headers = {},
  range
} = {}) => {
  const bearer = session.token || CFG.key;
  const h = {
    apikey: CFG.key,
    Authorization: `Bearer ${bearer}`,
    "Content-Type": "application/json",
    Prefer: "return=representation",
    ...headers
  };
  if (range) {
    h.Range = `${range[0]}-${range[1]}`;
    h.Prefer = "count=exact";
  }
  const res = await fetch(`${CFG.url}/rest/v1/${path}`, {
    method,
    headers: h,
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) {
    const t = await res.text();
    if (res.status === 401 && session.token) session.clear();
    throw new Error(friendlyError(res.status, t));
  }
  const total = res.headers.get("content-range");
  if (res.status === 204) return {
    data: null,
    total: null
  };
  const t = await res.text();
  const data = t ? JSON.parse(t) : null;
  return {
    data,
    total: total ? parseInt(total.split("/")[1]) : Array.isArray(data) ? data.length : null
  };
};
const rpc = async (fn, args = {}) => {
  const bearer = session.token || CFG.key;
  const res = await fetch(`${CFG.url}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: {
      apikey: CFG.key,
      Authorization: `Bearer ${bearer}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(args)
  });
  if (!res.ok) {
    const t = await res.text();
    if (res.status === 401 && session.token) session.clear();
    throw new Error(friendlyError(res.status, t));
  }
  const t = await res.text();
  return t ? JSON.parse(t) : null;
};
const friendlyError = (status, raw) => {
  if (status === 401) return "Your session expired — please sign in again.";
  if (status === 403) return "You don't have permission for that. Sign in as admin to make changes.";
  if (status === 409 || /duplicate/i.test(raw)) return "That already exists (a pack with this slug is taken).";
  if (status >= 500) return "The server had a problem. Please try again in a moment.";
  try {
    const j = JSON.parse(raw);
    return j.message || j.hint || raw;
  } catch {
    return raw || `Request failed (${status})`;
  }
};

// Render a question the way a child sees it.
const previewQuestion = (template, answer, alt, letters, difficulty) => {
  const word = (answer || "____").toUpperCase();
  let blank;
  if (difficulty === "advanced" || letters >= word.length) blank = "_".repeat(Math.max(3, word.length));else {
    const start = Math.max(0, word.length - letters);
    blank = word.slice(0, start) + "_".repeat(letters);
  }
  const sentence = (template || "").replace(/\{blank\}/g, blank);
  const opts = [answer, alt].filter(Boolean).map(w => w.toUpperCase()).join(" / ");
  return {
    sentence,
    opts
  };
};

const useBreakpoint = () => {
  const [w, setW] = useState(typeof window !== "undefined" ? window.innerWidth : 1200);
  useEffect(() => {
    let raf;
    const on = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => setW(window.innerWidth));
    };
    window.addEventListener("resize", on);
    window.addEventListener("orientationchange", on);
    return () => {
      window.removeEventListener("resize", on);
      window.removeEventListener("orientationchange", on);
      cancelAnimationFrame(raf);
    };
  }, []);
  return {
    w,
    isPhone: w < 640,
    isTablet: w >= 640 && w < 1024,
    isDesktop: w >= 1024
  };
};

// Toast system via a tiny event bus
const toastBus = (() => {
  let listeners = [];
  return {
    emit: t => listeners.forEach(l => l(t)),
    sub: fn => {
      listeners.push(fn);
      return () => {
        listeners = listeners.filter(l => l !== fn);
      };
    }
  };
})();
const notify = (message, opts = {}) => toastBus.emit({

  message,
  kind: opts.kind || "success",
  action: opts.action,
  duration: opts.duration ?? 3200
});
const useHotkey = (key, handler, active = true) => {
  useEffect(() => {
    if (!active) return;
    const on = e => {
      const k = e.key.toLowerCase();
      const combo = (e.metaKey || e.ctrlKey ? "mod+" : "") + k;
      if (combo === key || k === key) {
        handler(e);
      }
    };
    window.addEventListener("keydown", on);
    return () => window.removeEventListener("keydown", on);
  }, [key, handler, active]);
};

// Focus trap + Escape for modals/sheets
const useFocusTrap = (ref, active, onClose) => {
  useEffect(() => {
    if (!active || !ref.current) return;
    const node = ref.current;
    const sel = 'a[href],button:not([disabled]),textarea,input,select,[tabindex]:not([tabindex="-1"])';
    const first = node.querySelectorAll(sel)[0];
    first && first.focus();
    const onKey = e => {
      if (e.key === "Escape") {
        e.stopPropagation();
        onClose && onClose();
        return;
      }
      if (e.key !== "Tab") return;
      const items = [...node.querySelectorAll(sel)].filter(el => el.offsetParent !== null);
      if (!items.length) return;
      const f = items[0],
        l = items[items.length - 1];
      if (e.shiftKey && document.activeElement === f) {
        e.preventDefault();
        l.focus();
      } else if (!e.shiftKey && document.activeElement === l) {
        e.preventDefault();
        f.focus();
      }
    };
    node.addEventListener("keydown", onKey);
    return () => node.removeEventListener("keydown", onKey);
  }, [active, ref, onClose]);
};

// generic async runner with loading/error
const useAsync = (fn, deps = []) => {
  const [state, setState] = useState({
    loading: true,
    error: null,
    data: null
  });
  const run = useCallback(async () => {
    setState(s => ({
      ...s,
      loading: true,
      error: null
    }));
    try {
      const data = await fn();
      setState({
        loading: false,
        error: null,
        data
      });
      return data;
    } catch (e) {
      setState({
        loading: false,
        error: e.message,
        data: null
      });
    }
  }, deps); // eslint-disable-line
  useEffect(() => {
    run();
  }, [run]);
  return {
    ...state,
    reload: run,
    setData: d => setState(s => ({
      ...s,
      data: typeof d === "function" ? d(s.data) : d
    }))
  };
};
