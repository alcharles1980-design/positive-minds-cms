name: Deploy Supabase edge functions

# WHY THIS EXISTS
# Edge functions were being deployed by pasting the whole file into a tool call. mcp.ts is now ~68KB;
# that transcription is the riskiest operation in this repo and has already put a 1-line placeholder
# over the live mcp function once. It also causes silent drift (comments condensed in transit), so
# "deployed == repo" stops being true.
#
# This deploys edge-functions/*.ts EXACTLY as committed. Nothing is retyped.
#
# SETUP (one time): add a repository secret SUPABASE_ACCESS_TOKEN
#   Supabase dashboard → account → Access Tokens → generate
#   GitHub → repo → Settings → Secrets and variables → Actions → New repository secret
# Then this runs on any push that touches edge-functions/, or on demand.

on:
  push:
    branches: [main]
    paths:
      - "edge-functions/**"
      # NOT this workflow file. Editing CI must never ship code — the self-trigger meant that
      # touching the deploy script deployed the live mcp function as a side effect.
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run compares deployed vs repo and changes nothing. deploy overwrites live."
        required: true
        default: "dry-run"
        type: choice
        options: ["dry-run", "deploy"]
      only:
        description: "Just one function (slug), or leave blank for all"
        required: false

env:
  PROJECT_REF: tytrmjjucqijzcrbwjfm

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # The CLI expects supabase/functions/<slug>/index.ts. The repo keeps a flat
      # edge-functions/<slug>.ts, so lay out what the CLI wants without moving the source.
      - name: Stage functions
        run: |
          mkdir -p supabase/functions /tmp/repo-funcs
          for f in edge-functions/*.ts; do
            slug="$(basename "$f" .ts)"
            mkdir -p "supabase/functions/$slug"
            cp "$f" "supabase/functions/$slug/index.ts"
            cp "$f" "/tmp/repo-funcs/$slug.ts"
            echo "staged $slug"
          done

      # DRY RUN. Downloads what is actually deployed and diffs it against the repo, deploying
      # nothing. This is the only way to answer "is deployed == repo?" — the functions were
      # hand-pasted for months and drifted (comments condensed in transit), so the first automated
      # deploy could silently overwrite something that only exists on the server. Run this BEFORE
      # the first real deploy, and any time you are not sure.
      # DRY RUN. Downloads what is ACTUALLY deployed and compares it against the repo, deploying
      # nothing. Run this BEFORE the first real deploy, and any time you are not sure.
      #
      # WHY IT NORMALISES INSTEAD OF DIFFING. `supabase functions download` does not return your
      # source. It returns the extracted ESZIP BUNDLE: TypeScript transpiled away, formatting
      # re-printed, comments gone. A raw byte diff against the .ts source therefore ALWAYS differs
      # — the first run of this reported drift on all five functions, including ones that had just
      # been deployed from the repo. That is a false positive, and a check that always fires is
      # worse than no check.
      # So both sides are reduced to a comparable form: comments stripped, type annotations and
      # non-null assertions removed, all whitespace collapsed. What survives is the code that
      # actually runs. If the normalised forms match, there is no behavioural drift.
      - name: Dry run — compare deployed against repo
        if: github.event.inputs.mode == 'dry-run'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set +e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set — see the header of this workflow."
            exit 1
          fi
          cat > /tmp/norm.py <<'NORM'
          import re, sys
          src = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          src = re.sub(r'/\*[\s\S]*?\*/', ' ', src)          # block comments
          src = re.sub(r'(?m)^\s*//[^\n]*', ' ', src)          # whole-line comments
          src = re.sub(r'(?<![:\w"\x27])//[^\n]*', ' ', src)   # trailing comments (not URLs)
          src = re.sub(r'!(?=[.\)\],;])', '', src)            # non-null assertions
          src = re.sub(r':\s*(?:string|number|boolean|any|void|unknown)(?:\[\])?(?=\s*[,;)=}])', '', src)
          src = re.sub(r'\s+', ' ', src)
          print(src.strip())
          NORM
          sed -i 's/^          //' /tmp/norm.py
          ONLY="${{ github.event.inputs.only }}"
          DRIFT=0
          for f in /tmp/repo-funcs/*.ts; do
            slug="$(basename "$f" .ts)"
            if [ -n "$ONLY" ] && [ "$ONLY" != "$slug" ]; then continue; fi
            echo "::group::$slug"
            rm -rf "supabase/functions/$slug"
            supabase functions download "$slug" --project-ref "$PROJECT_REF" >/dev/null 2>&1
            LIVE="supabase/functions/$slug/index.ts"
            if [ ! -f "$LIVE" ]; then
              echo "not deployed yet (or download failed) — a deploy would CREATE it"
              echo "::endgroup::"; continue
            fi
            python3 /tmp/norm.py "$f"    > /tmp/a.txt
            python3 /tmp/norm.py "$LIVE" > /tmp/b.txt
            RA=$(wc -c < /tmp/a.txt); RB=$(wc -c < /tmp/b.txt)
            echo "normalised — repo: $RA   deployed: $RB"
            if cmp -s /tmp/a.txt /tmp/b.txt; then
              echo "NO BEHAVIOURAL DRIFT (raw bytes differ only by transpilation/formatting)"
            else
              DRIFT=1
              echo "::warning::$slug DIFFERS after normalisation — real drift"
              # Word-level so a reformat does not drown the actual change.
              tr ' ' '\n' < /tmp/b.txt > /tmp/bw.txt
              tr ' ' '\n' < /tmp/a.txt > /tmp/aw.txt
              diff /tmp/bw.txt /tmp/aw.txt > /tmp/d.txt 2>/dev/null
              echo "first 80 differing tokens (< deployed only, > repo only):"
              head -80 /tmp/d.txt
            fi
            echo "::endgroup::"
          done
          for f in /tmp/repo-funcs/*.ts; do
            slug="$(basename "$f" .ts)"
            mkdir -p "supabase/functions/$slug"; cp "$f" "supabase/functions/$slug/index.ts"
          done
          if [ "$DRIFT" = "1" ]; then
            echo "::warning::Real drift found. Read it BEFORE running mode=deploy — a deploy makes the repo win."
          else
            echo "No behavioural drift on any function: deployed matches repo."
          fi
          exit 0

      - name: Deploy
        if: github.event_name == 'push' || github.event.inputs.mode == 'deploy'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set — see the header of this workflow for setup."
            exit 1
          fi
          ONLY="${{ github.event.inputs.only }}"
          # mcp, content-api and game-feed authenticate their own callers, so they must NOT sit
          # behind Supabase's JWT gate. generate-questions does require a JWT.
          for d in supabase/functions/*/; do
            slug="$(basename "$d")"
            if [ -n "$ONLY" ] && [ "$ONLY" != "$slug" ]; then continue; fi
            case "$slug" in
              mcp|content-api|game-feed|pack-describe) FLAGS="--no-verify-jwt" ;;
              *) FLAGS="" ;;
            esac
            echo "::group::deploy $slug $FLAGS"
            supabase functions deploy "$slug" --project-ref "$PROJECT_REF" $FLAGS
            echo "::endgroup::"
          done
