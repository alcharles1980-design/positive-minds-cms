name: Deploy Supabase edge functions

# WHY THIS EXISTS
# Edge functions were being deployed by pasting the whole file into a tool call. mcp.ts is now ~68KB;
# that transcription is the riskiest operation in this repo and has already put a 1-line placeholder
# over the live mcp function once. It also causes silent drift (comments condensed in transit), so
# "deployed == repo" stops being true.
#
# This deploys edge-functions/*.ts EXACTLY as committed. Nothing is retyped.
#
# SETUP (one time): add a repository secret SUPABASE_ACCESS_TOKEN
#   Supabase dashboard → account → Access Tokens → generate
#   GitHub → repo → Settings → Secrets and variables → Actions → New repository secret
# Then this runs on any push that touches edge-functions/, or on demand.

on:
  push:
    branches: [main]
    paths:
      - "edge-functions/**"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch:
    inputs:
      only:
        description: "Deploy just one function (slug), or leave blank for all changed ones"
        required: false

env:
  PROJECT_REF: tytrmjjucqijzcrbwjfm

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # The CLI expects supabase/functions/<slug>/index.ts. The repo keeps a flat
      # edge-functions/<slug>.ts, so lay out what the CLI wants without moving the source.
      - name: Stage functions
        run: |
          mkdir -p supabase/functions
          for f in edge-functions/*.ts; do
            slug="$(basename "$f" .ts)"
            mkdir -p "supabase/functions/$slug"
            cp "$f" "supabase/functions/$slug/index.ts"
            echo "staged $slug"
          done

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set — see the header of this workflow for setup."
            exit 1
          fi
          ONLY="${{ github.event.inputs.only }}"
          # mcp, content-api and game-feed authenticate their own callers, so they must NOT sit
          # behind Supabase's JWT gate. generate-questions does require a JWT.
          for d in supabase/functions/*/; do
            slug="$(basename "$d")"
            if [ -n "$ONLY" ] && [ "$ONLY" != "$slug" ]; then continue; fi
            case "$slug" in
              mcp|content-api|game-feed|pack-describe) FLAGS="--no-verify-jwt" ;;
              *) FLAGS="" ;;
            esac
            echo "::group::deploy $slug $FLAGS"
            supabase functions deploy "$slug" --project-ref "$PROJECT_REF" $FLAGS
            echo "::endgroup::"
          done
