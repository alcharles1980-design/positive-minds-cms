name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths-ignore:
      - "mcp-shim/**"
      - ".github/workflows/deploy-mcp-shim.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The site is a Cloudflare WORKER (positive-minds-cms.…workers.dev) served via Static Assets
      # from ./public (see wrangler.toml). index.html is a self-contained React 18 + Babel-standalone
      # app — no build step here; public/index.html is committed already in sync.
      - name: Publish to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
